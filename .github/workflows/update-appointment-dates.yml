name: Run Procedure To Update Appointment Dates

on:
  schedule:
    cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  run script:
    runs-on: ubuntu-latest
    steps:
      - name: Install Postgres Client
        run: sudo apt-get install -y postgresql-client
      
      - name: Execute SQL Procedure
        run: psql -h ${{ secrets.DB_HOST }} -U ${{ secrets.DB_USER }} -d ${{ secrets.DB_NAME }} -p ${{ secrets.DB_PORT }} -c "CALL public.UpdateAppointmentDates();"
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
